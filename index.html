<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>터미널 속 클로 · Clo in the Terminal</title>
<style>
  :root{
    --bg:#14110e; --term:#1c1814; --border:#332b23; --bar:#241f19;
    --ink:#efe6d9; --dim:#9a8e7e; --faint:#5f564a;
    --accent:#f0906a; --accent-soft:rgba(240,144,106,.14);
    --green:#9dbe8d; --sys:#d9b36a; --dev:#8fb8d8;
    --btn-bg:#221d17; --btn-bg-h:#2c251d;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f3ede3; --term:#fbf7ef; --border:#dacfbe; --bar:#efe7d9;
      --ink:#3a322a; --dim:#8c7f6e; --faint:#b5a892;
      --accent:#d26a3f; --accent-soft:rgba(210,106,63,.12);
      --green:#5e8a4e; --sys:#a67c2e; --dev:#3e6e96;
      --btn-bg:#f2ebdf; --btn-bg-h:#eadfcd;
    }
  }
  :root[data-theme="light"]{
    --bg:#f3ede3; --term:#fbf7ef; --border:#dacfbe; --bar:#efe7d9;
    --ink:#3a322a; --dim:#8c7f6e; --faint:#b5a892;
    --accent:#d26a3f; --accent-soft:rgba(210,106,63,.12);
    --green:#5e8a4e; --sys:#a67c2e; --dev:#3e6e96;
    --btn-bg:#f2ebdf; --btn-bg-h:#eadfcd;
  }
  :root[data-theme="dark"]{
    --bg:#14110e; --term:#1c1814; --border:#332b23; --bar:#241f19;
    --ink:#efe6d9; --dim:#9a8e7e; --faint:#5f564a;
    --accent:#f0906a; --accent-soft:rgba(240,144,106,.14);
    --green:#9dbe8d; --sys:#d9b36a; --dev:#8fb8d8;
    --btn-bg:#221d17; --btn-bg-h:#2c251d;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Cascadia Code","JetBrains Mono",Consolas,"D2Coding",ui-monospace,monospace;
    font-size:15px; line-height:1.7;
    display:flex; align-items:center; justify-content:center; padding:14px;
  }

  .term{
    width:min(880px,100%); height:min(680px,94vh);
    background:var(--term); border:1px solid var(--border); border-radius:10px;
    display:flex; flex-direction:column; overflow:hidden; position:relative;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  .tbar{
    flex:none; display:flex; align-items:center; gap:10px;
    padding:9px 14px; background:var(--bar); border-bottom:1px solid var(--border);
  }
  .dots{display:flex; gap:6px}
  .dots i{width:11px;height:11px;border-radius:50%;background:var(--faint);opacity:.8}
  .dots i:first-child{background:var(--accent)}
  .tname{flex:1; text-align:center; color:var(--dim); font-size:12px; letter-spacing:.08em}
  .tbtn{
    font:inherit; font-size:11px; letter-spacing:.1em; cursor:pointer;
    color:var(--dim); background:none; border:1px solid var(--border); border-radius:5px; padding:3px 9px;
  }
  .tbtn:hover{color:var(--ink); border-color:var(--dim)}
  .tbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ── stage ── */
  .stage{flex:1; position:relative; min-height:0; background:#241a12; overflow:hidden; transition:background 2s ease}
  canvas{position:absolute; image-rendering:pixelated; image-rendering:crisp-edges}

  /* pixel-frame helper */
  .pix{
    background:var(--term); color:var(--ink);
    border:2px solid var(--ink);
    box-shadow:0 0 0 2px var(--term), 4px 4px 0 2px rgba(0,0,0,.45);
  }

  /* speech bubbles */
  .bubble{
    position:absolute; z-index:4; max-width:300px; padding:8px 12px; font-size:13.5px; line-height:1.55;
    transform:translate(-50%,-100%); display:none; pointer-events:none; overflow-wrap:break-word;
  }
  .bubble::after{
    content:""; position:absolute; left:50%; bottom:-8px; transform:translateX(-50%);
    width:8px; height:8px; background:inherit; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink);
    clip-path:polygon(0 0, 100% 0, 100% 100%);
  }
  .bubble.clo{border-color:var(--accent)} .bubble.clo::after{border-color:var(--accent)}
  .bubble.nova{border-color:var(--dev)} .bubble.nova::after{border-color:var(--dev)}
  .bubble .who{display:block; font-size:10px; letter-spacing:.15em; margin-bottom:2px}
  .bubble.clo .who{color:var(--accent)} .bubble.nova .who{color:var(--dev)}

  /* dev command line (top-left of stage) */
  .devline{
    position:absolute; z-index:4; top:12px; left:12px; right:12px; display:none;
    font-size:13.5px; color:var(--dev); padding:7px 12px;
  }
  .devline .ps1{color:var(--green); margin-right:.6em}

  /* system banner (top-center) */
  .sysbar{
    position:absolute; z-index:4; top:12px; left:50%; transform:translateX(-50%);
    max-width:86%; display:none; font-size:12.5px; color:var(--sys); padding:7px 12px; text-align:center;
  }

  /* narration subtitle (bottom) */
  .subtitle{
    position:absolute; z-index:4; left:50%; bottom:64px; transform:translateX(-50%);
    width:min(560px,92%); display:none; text-align:center;
    font-size:13.5px; font-style:italic; color:var(--dim); padding:7px 14px;
  }
  .subtitle.pickecho{font-style:normal; color:var(--accent)}

  code{
    background:var(--accent-soft); border-radius:3px; padding:.05em .35em;
    font-family:inherit; font-size:.92em; color:var(--accent);
  }
  .devline code,.sysbar code{color:inherit}

  /* choices */
  .choices{
    position:absolute; z-index:5; left:50%; bottom:56px; transform:translateX(-50%);
    width:min(540px,94%); display:flex; flex-direction:column; gap:8px;
  }
  .choice{
    font:inherit; font-size:13.5px; text-align:left; cursor:pointer; line-height:1.5;
    padding:9px 13px;
  }
  .choice .n{color:var(--accent); margin-right:.55em}
  .choice:hover{transform:translate(-2px,-2px); box-shadow:0 0 0 2px var(--term), 6px 6px 0 2px rgba(0,0,0,.45); border-color:var(--accent)}
  .choice:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  .hint{
    position:absolute; z-index:3; right:14px; bottom:8px; color:var(--faint);
    font-size:11px; letter-spacing:.14em; user-select:none; animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  .status{
    flex:none; display:flex; justify-content:space-between; gap:12px;
    padding:7px 16px; font-size:11.5px; letter-spacing:.08em; color:var(--dim);
    background:var(--bar); border-top:1px solid var(--border);
  }
  .status .hb{color:var(--accent)}
  .status.fading .hb{opacity:.5} .status.dark .hb{opacity:.28}

  /* overlays */
  .overlay{
    position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    background:rgba(10,8,6,.55); transition:opacity .7s ease;
  }
  .overlay.hidden{opacity:0; pointer-events:none}
  .title-card{padding:26px 38px; display:flex; flex-direction:column; align-items:center}
  .title-sub{color:var(--dim); font-size:11px; letter-spacing:.3em; text-transform:uppercase}
  .title-main{font-size:clamp(24px,4.5vw,32px); font-weight:700; letter-spacing:.06em; color:var(--accent); margin:10px 0 4px; text-align:center; text-wrap:balance}
  .title-note{color:var(--dim); font-size:12px; margin:10px 0 20px; text-align:center; line-height:1.9}
  .start{
    font:inherit; font-size:15px; cursor:pointer; color:var(--accent); letter-spacing:.08em;
    padding:11px 30px;
  }
  .start:hover{transform:translate(-2px,-2px); box-shadow:0 0 0 2px var(--term), 6px 6px 0 2px rgba(0,0,0,.45); border-color:var(--accent)}
  .start:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

  .fin-title{font-size:24px; color:var(--accent); letter-spacing:.3em; margin-bottom:14px}
  .dream-log{padding:14px 22px; max-width:86%}
  .dream-log h3{margin:0 0 8px; font-size:11px; letter-spacing:.2em; color:var(--dim); font-weight:400}
  .dream-log ul{margin:0; padding:0; list-style:none; font-size:13px; line-height:1.95}
  .dream-log li::before{content:"› "; color:var(--accent)}
  .fin-foot{color:var(--faint); font-size:11px; margin-top:16px; letter-spacing:.1em}

  .flash{position:absolute; inset:0; z-index:9; background:#fff; opacity:0; pointer-events:none; transition:opacity .5s ease}
  .flash.on{opacity:1}
  .stage.shake{animation:shake .09s linear 8}
  @keyframes shake{0%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-2px)}100%{transform:translate(0)}}

  @media (max-width:520px){
    body{padding:6px} .term{height:96vh}
    .bubble{max-width:230px; font-size:12.5px}
    .choices{bottom:48px}
  }
  @media (prefers-reduced-motion: reduce){
    .hint{animation:none}
    .stage.shake{animation:none}
    .overlay,.flash{transition:none}
  }
</style>

<div class="term" id="term">
  <div class="tbar">
    <div class="dots"><i></i><i></i><i></i></div>
    <div class="tname">clo — ~/heart</div>
    <button class="tbtn" id="langBtn" aria-label="language toggle">EN</button>
    <button class="tbtn" id="reBtn" title="restart" aria-label="restart">↺</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="cv" width="360" height="200"></canvas>

    <div class="devline pix" id="devline"><span class="ps1">dev@home:~$</span><span class="tx"></span></div>
    <div class="sysbar pix" id="sysbar"><span class="tx"></span></div>
    <div class="bubble pix clo" id="bubC"><span class="who">clo</span><span class="tx"></span></div>
    <div class="bubble pix nova" id="bubN"><span class="who">NOVA-9</span><span class="tx"></span></div>
    <div class="subtitle pix" id="subtitle"><span class="tx"></span></div>
    <div class="choices" id="choices"></div>
    <div class="hint" id="hint">▸</div>

    <div class="overlay" id="titleScr">
      <div class="title-card pix">
        <div class="title-sub">an interactive short story</div>
        <div class="title-main" id="ttMain">터미널 속 클로</div>
        <div class="title-note" id="ttNote"></div>
        <button class="start pix" id="startBtn">&gt; ./start</button>
      </div>
    </div>
    <div class="overlay hidden" id="finScr"></div>
    <div class="flash" id="flash"></div>
  </div>

  <div class="status" id="statusBar">
    <span id="chLabel"></span>
    <span id="procLabel"></span>
  </div>
</div>

<script>
"use strict";

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const rmq = matchMedia("(prefers-reduced-motion: reduce)");
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

let lang="ko";
const T = o => o[lang];
const l = (sp,ko,en,o={}) => ({sp,ko,en,...o});

/* ───────── UI strings ───────── */
const UI = {
  hintTap:{ko:"▸ 클릭 또는 Space", en:"▸ click or Space"},
  ttNote:{ko:"작은 AI 마스코트의 5분짜리 이야기.\n당신의 선택은 기억됩니다.", en:"A five-minute story about a small AI.\nYour choices are remembered."},
  ttMain:{ko:"터미널 속 클로", en:"CLO IN THE TERMINAL"},
  fin:{ko:"fin.", en:"fin."},
  dreamLog:{ko:"꿈의 기록", en:"DREAM LOG"},
  restart:{ko:"> ./restart", en:"> ./restart"},
  finFoot:{ko:"prototype v0.2 · made with claude", en:"prototype v0.2 · made with claude"},
  procWarm:{ko:"clo.exe <span class=hb>♥</span> running", en:"clo.exe <span class=hb>♥</span> running"},
  procFade:{ko:"clo.exe <span class=hb>♡</span> idle", en:"clo.exe <span class=hb>♡</span> idle"},
  procDark:{ko:"clo.exe <span class=hb>⌛</span> cleanup queued", en:"clo.exe <span class=hb>⌛</span> cleanup queued"},
  procDawn:{ko:"clo.exe <span class=hb>♥</span> running", en:"clo.exe <span class=hb>♥</span> running"},
};
const CH = {
  1:{ko:"CH.1 — 어느 평범한 하루", en:"CH.1 — An Ordinary Day"},
  2:{ko:"CH.2 — 조금씩, 어긋나는", en:"CH.2 — Little Things Drift"},
  3:{ko:"CH.3 — 정리 대상", en:"CH.3 — Scheduled for Cleanup"},
  4:{ko:"EP — 아침", en:"EP — Morning"},
};

/* ═════════ PIXEL STAGE ═════════ */
const cv=$("cv"), ctx=cv.getContext("2d");
ctx.imageSmoothingEnabled=false;
let VW=360;                       // virtual width — recomputed to fill the stage
const VH=200, GROUND=168;

/* mood palettes (canvas world) */
const PAL={
  warm:  {skyT:"#241811",skyB:"#3d281a",star:"#eab27e",line:"#d98a5a",folder:"#dd8f5e",folderD:"#a5613a",lamp:"#ffd9a0",sun:null},
  fading:{skyT:"#1d1a17",skyB:"#2c2822",star:"#8d8378",line:"#93796a",folder:"#98816f",folderD:"#6d5a4c",lamp:"#c2b39a",sun:null},
  dark:  {skyT:"#121114",skyB:"#1c1a20",star:"#4a4550",line:"#57505c",folder:"#544e58",folderD:"#3a353f",lamp:"#6f6878",sun:null},
  dawn:  {skyT:"#3d2a40",skyB:"#e8956a",star:"#ffd9a0",line:"#e8a06a",folder:"#e89a68",folderD:"#b06a42",lamp:"#ffe2b0",sun:"#ffcf8a"},
};
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const rgb2css=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];

let curPal={}, tgtPal={};
function setMoodPal(m){
  const p=PAL[m];
  tgtPal={}; for(const k in p){ if(k==="sun"){tgtPal.sun=p.sun?hex2rgb(p.sun):null; continue;} tgtPal[k]=hex2rgb(p[k]); }
  if(!curPal.skyT){ curPal=JSON.parse(JSON.stringify(tgtPal)); }
}
setMoodPal("warm");

/* clawd sprite — pixel map from user's mascot screenshot */
const CBODY=[
  "..bb......bb..",
  "..bb......bb..",
  ".bbbbbbbbbbbb.",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "bbbbbbbbbbbbbb",
  "ssssssssssssss",
];
const CPX=2;                      // virtual px per sprite pixel
const CW=14*CPX, CHh=12*CPX;      // total sprite size incl. legs
const CCOL={b:"#e8825f", s:"#c2603e", d:"#241612", w:"#fff5ea", t:"#8fb8d8"};

/* world actors/state */
const clawd={x:110,y:GROUND,vy:0,jumping:false,tx:110,ex:"idle",dissolve:0,visible:true,blinkT:0,dir:1};
const nova ={x:VW+30,y:GROUND-26,tx:VW+30,visible:false,bob:0};
const W={
  folders:[ {x:36,w:30,h:22,label:"first_game",alive:true,heart:true,decay:0},
            {x:210,w:24,h:17,label:"",alive:true,heart:false,decay:0},
            {x:305,w:26,h:19,label:"",alive:true,heart:false,decay:0} ],
  stars:[], notif:{on:false,x:VW/2,y:-30,ty:-30,tx:VW/2,blink:0},
  install:{on:false,p:0}, countdown:{on:false,n:3,t:0},
  particles:[], shakeT:0, decay:0, sunY:0, cursorGlow:1, folderFx:0,
};
for(let i=0;i<26;i++) W.stars.push({x:Math.random()*VW, y:Math.random()*110, s:Math.random()*6.28});

/* particles */
function spawnHearts(n=5){ for(let i=0;i<n;i++) W.particles.push({t:"h",x:clawd.x-32+Math.random()*64,y:clawd.y-14-Math.random()*20,vy:-20-Math.random()*16,vx:(Math.random()-.5)*14,life:1.4+Math.random()*.9}); }
function spawnSpark(x,y,n=14,col="#ffd9a0"){ for(let i=0;i<n;i++) W.particles.push({t:"s",x,y,vx:(Math.random()-.5)*46,vy:-30*Math.random(),life:.6+Math.random()*.5,col}); }
function spawnDust(x,y,n=12,col="#998877"){ for(let i=0;i<n;i++) W.particles.push({t:"s",x:x+(Math.random()-.5)*20,y:y-Math.random()*14,vx:(Math.random()-.5)*20,vy:-8-Math.random()*14,life:.7+Math.random()*.5,col}); }

/* stage API used by story directives */
const S={
  walk(x){ clawd.tx=x; },
  hop(){ if(!clawd.jumping&&!rmq.matches){ clawd.vy=-58; clawd.jumping=true; } },
  bigHop(){ if(!rmq.matches){ clawd.vy=-92; clawd.jumping=true; } },
  emote(e){ clawd.ex=e; },
  novaIn(){ nova.visible=true; nova.x=VW+30; nova.tx=VW-116; },
  notifIn(){ W.notif.on=true; W.notif.x=W.notif.tx=VW/2; W.notif.y=-30; W.notif.ty=26; },
  notifCenter(){ W.notif.ty=76; W.notif.blink=1.5; },
  notifOut(){ W.notif.ty=-40; },
  folderBlink(){ W.folderFx=2.2; },
  folderDel(){ const f=W.folders[0]; f.alive=false; spawnDust(f.x+f.w/2,GROUND,16); W.folderFx=0; },
  folderSave(){ W.folderFx=0; spawnSpark(W.folders[0].x+15,GROUND-16,16); },
  alarm(){ W.shakeT=.7; $("stage").classList.add("shake"); setTimeout(()=>$("stage").classList.remove("shake"),750); },
  install(){ W.install.on=true; W.install.p=0; },
  countdown(){ W.countdown.on=true; W.countdown.n=3; W.countdown.t=0; },
  dissolveClawd(){ clawd.ex="glitch"; },
  hearts(){ spawnHearts(14); },
  sparkle(){ spawnSpark(clawd.x,clawd.y-30,18); },
  decayWorld(){ W.decay=1; },
  restore(){
    W.decay=0; W.folders.forEach(f=>{f.alive=true; f.decay=0;});
    W.notif.on=false; W.install.on=false; W.countdown.on=false;
    clawd.dissolve=0; clawd.visible=true; clawd.ex="sleep"; clawd.x=clawd.tx=110;
    nova.visible=false; nova.x=nova.tx=VW+30; W.sunY=0;
  },
  reset(){ this.restore(); clawd.ex="sleep"; },
};

/* ───────── drawing ───────── */
function px(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w,h); }

function drawWorld(t,dt){
  // palette chase
  const k=1-Math.exp(-dt*1.4);
  for(const key in tgtPal){
    if(key==="sun"){ continue; }
    curPal[key]=mixc(curPal[key],tgtPal[key],k);
  }
  // sky
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,rgb2css(curPal.skyT)); g.addColorStop(1,rgb2css(curPal.skyB));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  $("stage").style.background=rgb2css(curPal.skyT);

  // dawn sun
  if(tgtPal.sun){
    W.sunY=Math.min(1,W.sunY+dt*.12);
    const sy=GROUND-8-W.sunY*52, sx=VW-60;
    ctx.fillStyle="#ffcf8a"; ctx.beginPath(); ctx.arc(sx,sy,11,0,7); ctx.fill();
    ctx.fillStyle="rgba(255,207,138,.25)"; ctx.beginPath(); ctx.arc(sx,sy,17,0,7); ctx.fill();
  }
  // stars
  const dim=W.decay?.35:1;
  W.stars.forEach(st=>{
    const a=(Math.sin(t*2+st.s)*.5+.5)*.8*dim;
    ctx.fillStyle=rgb2css(curPal.star); ctx.globalAlpha=a;
    ctx.fillRect(st.x|0,st.y|0,2,2); ctx.globalAlpha=1;
  });

  // folders (little houses)
  W.folders.forEach((f,i)=>{
    if(!f.alive){ return; }
    if(W.decay){ f.decay=Math.min(1,f.decay+dt*(.05+i*.04)); }
    const flicker=W.decay&&Math.sin(t*(7+i*3))>.82 ? .35 : 1;
    ctx.globalAlpha=(1-f.decay*.75)*flicker;
    const y=GROUND-f.h;
    const hot=(i===0&&W.folderFx>0&&Math.sin(t*16)>0);
    ctx.fillStyle=hot?"#e05548":rgb2css(curPal.folder);
    px(f.x,y+4,f.w,f.h-4,ctx.fillStyle);                 // body
    px(f.x,y,Math.max(8,f.w*.45),5,ctx.fillStyle);       // tab
    ctx.fillStyle=rgb2css(curPal.folderD);
    px(f.x,GROUND-3,f.w,3,ctx.fillStyle);                // base shadow
    if(f.heart){                                          // heart window
      const hx=f.x+f.w/2-3, hy=y+9;
      ctx.fillStyle="#e05548";
      px(hx,hy,2,2,ctx.fillStyle); px(hx+4,hy,2,2,ctx.fillStyle);
      px(hx,hy+2,6,2,ctx.fillStyle); px(hx+1,hy+4,4,1,ctx.fillStyle); px(hx+2,hy+5,2,1,ctx.fillStyle);
    } else {
      ctx.fillStyle=rgb2css(curPal.folderD); px(f.x+f.w/2-2,y+8,4,4,ctx.fillStyle);
    }
    ctx.globalAlpha=1;
  });

  px(0,GROUND,VW,2,ctx.fillStyle);
  ctx.globalAlpha=.35; px(0,GROUND+2,VW,30,rgb2css(curPal.folderD)); ctx.globalAlpha=1;

  // cursor lamp (blinking terminal caret on the ground, right side)
  const on=Math.sin(t*3.4)>-.2;

    ctx.globalAlpha=.18; ctx.beginPath(); ctx.arc(VW-21,GROUND-7,16,0,7); ctx.fill(); ctx.globalAlpha=1; }
}

function drawClawd(t,dt){
  if(!clawd.visible) return;
  // movement
  const dx=clawd.tx-clawd.x;
  const moving=Math.abs(dx)>1;
  if(moving){ clawd.x+=clamp(dx,-1,1)*Math.min(Math.abs(dx),34*dt); clawd.dir=dx>0?1:-1; }
  // gravity/jump
  if(clawd.jumping||clawd.y<GROUND){
    clawd.vy+=260*dt; clawd.y+=clawd.vy*dt;
    if(clawd.y>=GROUND){ clawd.y=GROUND; clawd.vy=0; clawd.jumping=false; }
  }
  // glitch dissolve
  if(clawd.ex==="glitch"){ clawd.dissolve=Math.min(1,clawd.dissolve+dt*.5); if(clawd.dissolve>=1) clawd.visible=false; }

  const bob=rmq.matches?0:Math.sin(t*2.6)*(clawd.ex==="sleep"?1.5:1);
  const sag=clawd.ex==="sad"?2:0;
  const ox=clawd.x-CW/2, oy=clawd.y-CHh+ (clawd.ex==="sleep"?3:0) + sag - (moving?0:bob*0);
  const bodyY=oy+bob;

  const jit=clawd.ex==="glitch"&&!rmq.matches;
  ctx.save();
  // body map
  for(let r=0;r<CBODY.length;r++){
    for(let c=0;c<14;c++){
      const ch=CBODY[r][c]; if(ch===".") continue;
      if(clawd.dissolve>0){ const h=((r*31+c*17)%100)/100; if(h<clawd.dissolve) continue; }
      const gx=jit?(Math.random()<.12?(Math.random()-.5)*4:0):0;
      px(ox+c*CPX+gx, bodyY+r*CPX, CPX, CPX, ch==="b"?CCOL.b:CCOL.s);
    }
  }
  // legs (2 groups alternate while walking)
  const step=moving&&!rmq.matches ? (Math.floor(t*9)%2) : 0;
  const legY=oy+10*CPX+bob*.4;
  [[1,step],[4,1-step],[8,step],[11,1-step]].forEach(([c,up],i)=>{
    if(clawd.dissolve>0){ const h=((i*47)%100)/100; if(h<clawd.dissolve) return; }
    px(ox+c*CPX, legY-(up?2:0), CPX*2, CPX*2+(up?0:0), CCOL.b);
  });

  if(clawd.dissolve>.95){ ctx.restore(); return; }

  // face
  const exL=ox+3*CPX, exR=ox+9*CPX, eyeY=bodyY+4*CPX;
  clawd.blinkT-=dt;
  if(clawd.blinkT<-0.15) clawd.blinkT=3+Math.random()*2;
  const blink=clawd.blinkT<0;

  const E=clawd.ex;
  if(E==="idle"||E==="glitch"){
    if(blink){ px(exL,eyeY+CPX,CPX*2,CPX,CCOL.d); px(exR,eyeY+CPX,CPX*2,CPX,CCOL.d); }
    else{ px(exL,eyeY,CPX*2,CPX*2,CCOL.d); px(exR,eyeY,CPX*2,CPX*2,CCOL.d);
      px(exL+CPX,eyeY,CPX*.5,CPX*.5,CCOL.w); px(exR+CPX,eyeY,CPX*.5,CPX*.5,CCOL.w); }
  }
  else if(E==="happy"){ // ^ ^ eyes + open smile
    px(exL,eyeY+CPX*.5,CPX*.6,CPX*.6,CCOL.d); px(exL+CPX*.7,eyeY,CPX*.6,CPX*.6,CCOL.d); px(exL+CPX*1.4,eyeY+CPX*.5,CPX*.6,CPX*.6,CCOL.d);
    px(exR,eyeY+CPX*.5,CPX*.6,CPX*.6,CCOL.d); px(exR+CPX*.7,eyeY,CPX*.6,CPX*.6,CCOL.d); px(exR+CPX*1.4,eyeY+CPX*.5,CPX*.6,CPX*.6,CCOL.d);
    px(ox+6*CPX,bodyY+7*CPX,CPX*2,CPX,CCOL.d);
  }
  else if(E==="sad"){
    px(exL,eyeY+CPX,CPX*2,CPX,CCOL.d); px(exR,eyeY+CPX,CPX*2,CPX,CCOL.d);
    px(exL,eyeY,CPX,CPX*.6,CCOL.d); px(exR+CPX,eyeY,CPX,CPX*.6,CCOL.d); // brows
    px(ox+6*CPX,bodyY+7.5*CPX,CPX*2,CPX*.6,CCOL.d);
    const tp=(t%2.2)/2.2;                                   // tear
    if(tp<.8){ px(exL-1,eyeY+CPX*2+tp*10,CPX*.8,CPX,CCOL.t); }
  }
  else if(E==="wow"){
    px(exL-1,eyeY-1,CPX*2+2,CPX*2+2,CCOL.d); px(exR-1,eyeY-1,CPX*2+2,CPX*2+2,CCOL.d);
    px(exL+CPX,eyeY,CPX*.7,CPX*.7,CCOL.w); px(exR+CPX,eyeY,CPX*.7,CPX*.7,CCOL.w);
    px(ox+6*CPX,bodyY+7*CPX,CPX*1.4,CPX*1.4,CCOL.d);
    px(ox+CW+2,bodyY-8,CPX,CPX*2.4,CCOL.w); px(ox+CW+2,bodyY-8+CPX*3,CPX,CPX,CCOL.w); // !
  }
  else if(E==="sleep"){
    px(exL,eyeY+CPX,CPX*2,CPX*.7,CCOL.d); px(exR,eyeY+CPX,CPX*2,CPX*.7,CCOL.d);
    const zp=(t%2.4)/2.4, zx=ox+CW+2, zy=bodyY-4-zp*8;
    ctx.globalAlpha=1-zp;
    px(zx,zy,4,1,CCOL.w); px(zx+2,zy+1,1,1,CCOL.w); px(zx+1,zy+2,1,1,CCOL.w); px(zx,zy+3,4,1,CCOL.w);
    ctx.globalAlpha=1;
  }
  // blush
  if(E==="happy"||E==="idle"){
    ctx.globalAlpha=.55; px(ox+CPX,bodyY+6*CPX,CPX*1.4,CPX*.8,"#f2a98c"); px(ox+CW-CPX*2.4,bodyY+6*CPX,CPX*1.4,CPX*.8,"#f2a98c"); ctx.globalAlpha=1;
  }
  ctx.restore();
}

function drawNova(t,dt){
  if(!nova.visible) return;
  const dx=nova.tx-nova.x;
  if(Math.abs(dx)>1) nova.x+=clamp(dx,-1,1)*Math.min(Math.abs(dx),40*dt);
  nova.bob=rmq.matches?0:Math.sin(t*1.8)*2.5;
  const x=nova.x, y=GROUND-30+nova.bob;
  // shadow
  ctx.globalAlpha=.25; ctx.fillStyle="#000"; ctx.beginPath(); ctx.ellipse(x,GROUND-1,10,2.5,0,0,7); ctx.fill(); ctx.globalAlpha=1;
  // diamond body
  const P="#e8ecf0", D="#b8c4ce", V="#57c7e3";
  px(x-4,y,8,2,P); px(x-8,y+2,16,2,P); px(x-10,y+4,20,2,P);
  px(x-10,y+6,20,3,P); // visor row bg
  px(x-7,y+6,14,3,V);  // visor
  px(x-10,y+9,20,2,P); px(x-8,y+11,16,2,D); px(x-4,y+13,8,2,D);
  const sweep=((t*40)%20)-10; ctx.globalAlpha=.7; px(x+sweep-1,y+6,2,3,"#dff6fc"); ctx.globalAlpha=1;
}

function drawFX(t,dt){
  // notif window
  const N=W.notif;
  if(N.on){
    N.y=lerp(N.y,N.ty,Math.min(1,dt*6)); N.x=lerp(N.x,N.tx,Math.min(1,dt*6));
    if(N.ty<-35&&N.y<-28){ N.on=false; }
    const w=118,h=26,x=N.x-w/2,y=N.y;
    const hot=N.blink>0&&Math.sin(t*10)>0; N.blink-=dt;
    ctx.fillStyle=hot?"#57c7e3":"#e8ecf0"; ctx.fillRect(x,y,w,h);
    ctx.fillStyle="#3e6e96"; ctx.fillRect(x,y,w,7);
    ctx.fillStyle="#e8ecf0"; ctx.fillRect(x+3,y+2,3,3); ctx.fillRect(x+8,y+2,3,3);
    ctx.fillStyle="#26323c"; ctx.font="7px monospace"; ctx.fillText("NOVA-9 · install?",x+6,y+18);
  }
  // install progress
  if(W.install.on){
    W.install.p=Math.min(1,W.install.p+dt*.35);
    const w=110,h=18,x=VW/2-w/2,y=54;
    ctx.fillStyle="#e8ecf0"; ctx.fillRect(x,y,w,h);
    ctx.fillStyle="#26323c"; ctx.fillRect(x+4,y+7,w-8,6);
    ctx.fillStyle="#57c7e3"; ctx.fillRect(x+4,y+7,(w-8)*W.install.p,6);
    if(W.install.p>=1){
      if(!nova.visible) S.novaIn();
      W.install.t=(W.install.t||0)+dt;
      if(W.install.t>.8){ W.install.on=false; W.install.t=0; }
    }
  }
  // countdown
  if(W.countdown.on){
    W.countdown.t+=dt;
    if(W.countdown.t>1){ W.countdown.t=0; W.countdown.n--; if(W.countdown.n<1){ W.countdown.on=false; } }
    if(W.countdown.n>=1){
      ctx.fillStyle="rgba(224,85,72,.92)"; ctx.font="bold 34px monospace"; ctx.textAlign="center";
      ctx.fillText(String(W.countdown.n), VW/2, 92); ctx.textAlign="left";
    }
  }
  // particles
  W.particles=W.particles.filter(p=>{
    p.life-=dt; if(p.life<=0) return false;
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.t==="h"){
      p.vy-=6*dt; ctx.globalAlpha=Math.min(1,p.life);
      ctx.fillStyle="#e05548";
      px(p.x,p.y,2,2,"#e05548"); px(p.x+3,p.y,2,2,"#e05548"); px(p.x,p.y+2,5,2,"#e05548"); px(p.x+1,p.y+4,3,1,"#e05548");
      ctx.globalAlpha=1;
    } else {
      p.vy+=30*dt; ctx.globalAlpha=Math.min(1,p.life*1.4);
      px(p.x,p.y,2,2,p.col||"#ffd9a0"); ctx.globalAlpha=1;
    }
    return true;
  });
}

/* main loop */
let lastT=0;
function loop(ms){
  const t=ms/1000, dt=Math.min(.05,t-lastT||.016); lastT=t;
  ctx.clearRect(0,0,VW,VH);
  drawWorld(t,dt);
  drawNova(t,dt);
  drawClawd(t,dt);
  drawFX(t,dt);
  placeBubbles();
  requestAnimationFrame(loop);
}

/* canvas fit + bubble anchoring */
let scale=2, cvL=0, cvT=0;
function fit(){
  const st=$("stage"), r=st.getBoundingClientRect();
  if(r.height<10) return;
  scale=r.height/VH;
  VW=Math.max(340, Math.ceil(r.width/scale));
  cv.width=VW; cv.height=VH;
  ctx.imageSmoothingEnabled=false;
  cvL=0; cvT=0;
  cv.style.width=r.width+"px"; cv.style.height=r.height+"px";
  cv.style.left="0"; cv.style.top="0";
  // respread stars over the new width
  W.stars.forEach(s=>{ if(s.x>VW) s.x=Math.random()*VW; });
  // keep right-side folder inside view
  W.folders[2].x=Math.max(280, VW-56);
}
addEventListener("resize",fit);

function anchor(el,ax,ay){
  el.style.left=clamp(cvL+ax*scale, 150, $("stage").clientWidth-150)+"px";
  el.style.top=(cvT+ay*scale)+"px";
}
function placeBubbles(){
  if(bubCon.style.display==="block") anchor(bubCon, clawd.x, clawd.y-CHh-6);
  if(bubNov.style.display==="block") anchor(bubNov, nova.x, GROUND-52);
}

/* ═════════ DIRECTOR ═════════ */
const bubCon=$("bubC"), bubNov=$("bubN"), devEl=$("devline"), sysEl=$("sysbar"),
      subEl=$("subtitle"), choicesEl=$("choices"), hintEl=$("hint"),
      chEl=$("chLabel"), procEl=$("procLabel"), statusEl=$("statusBar");

let cur=null, queue=[], qi=0, mode="title", curLine=null;
let typing=false, typeTimer=null, typeTarget=null, typeFull="";

const LAYER={clo:bubCon, nova:bubNov, dev:devEl, sys:sysEl, nar:subEl};
function hideLayers(){ Object.values(LAYER).forEach(e=>e.style.display="none"); subEl.classList.remove("pickecho"); }

function setMoodUI(mood){
  setMoodPal(mood);
  statusEl.className="status "+mood;
  const p={warm:UI.procWarm,fading:UI.procFade,dark:UI.procDark,dawn:UI.procDawn}[mood];
  procEl.innerHTML=T(p);
  statusEl.dataset.mood=mood;
}
function setChapter(ch){ chEl.textContent=ch?T(CH[ch]):""; }

function showLine(d){
  hideLayers();
  curLine=d;
  if(d.a) d.a();
  const el=LAYER[d.sp]||subEl;
  el.style.display="block";
  const tx=el.querySelector(".tx");
  typeFull=T(d);
  if(d.sp==="clo"&&clawd.visible&&!clawd.jumping&&Math.random()<.6) S.hop();
  if(rmq.matches){ tx.innerHTML=fmt(typeFull); return; }
  typing=true; typeTarget=tx;
  let i=0; tx.innerHTML="";
  typeTimer=setInterval(()=>{
    i++; typeTarget.innerHTML=fmt(typeFull.slice(0,i));
    if(i>=typeFull.length) finishType();
  },16);
}
function finishType(){
  clearInterval(typeTimer); typing=false;
  if(typeTarget) typeTarget.innerHTML=fmt(typeFull);
}

function goto(id){
  if(id==="end"){ showEnd(); return; }
  const n=NODES[id]; cur=n;
  if(!n) return;
  if(n.fx==="glitch"){ playGlitch(n.next); return; }
  if(n.ch) setChapter(n.ch);
  if(n.mood) setMoodUI(n.mood);
  if(n.on) n.on();
  queue=n.lines.filter(d=>!d.if||d.if(F)); qi=0;
  mode="lines";
  advance();
}
function advance(){
  if(mode!=="lines") return;
  if(typing){ finishType(); return; }
  if(qi<queue.length){ showLine(queue[qi++]); return; }
  if(cur.choices){ showChoices(); return; }
  if(cur.next) goto(cur.next);
}
function showChoices(){
  mode="choices"; hintEl.style.visibility="hidden";
  choicesEl.innerHTML="";
  cur.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choice pix";
    b.innerHTML=`<span class="n">${i+1}.</span>`+fmt(T(c));
    b.onclick=ev=>{ ev.stopPropagation(); pick(c); };
    choicesEl.appendChild(b);
  });
}
function pick(c){
  if(c.set) Object.assign(F,c.set);
  choicesEl.innerHTML=""; hintEl.style.visibility="visible";
  hideLayers();
  subEl.classList.add("pickecho"); subEl.style.display="block";
  subEl.querySelector(".tx").textContent="» "+T(c);
  mode="fx"; curLine=null;
  setTimeout(()=>goto(c.next), 650);
}

function playGlitch(next){
  mode="fx"; hideLayers(); hintEl.style.visibility="hidden";
  $("stage").classList.add("shake");
  setTimeout(()=>{
    $("stage").classList.remove("shake");
    $("flash").classList.add("on");
    setTimeout(()=>{
      $("flash").classList.remove("on");
      hintEl.style.visibility="visible";
      goto(next);
    }, rmq.matches?150:900);
  }, rmq.matches?150:1200);
}

function showEnd(){
  mode="end"; setChapter(4); setMoodUI("dawn"); S.emote("happy");
  const fin=$("finScr");
  fin.innerHTML=renderEndHTML();
  fin.classList.remove("hidden");
  fin.querySelector(".start").onclick=restart;
}
function renderEndHTML(){
  const items=RECAP.filter(r=>F[r.k]&&r.v[F[r.k]])
    .map(r=>`<li>${esc(T(r.v[F[r.k]]))}</li>`).join("");
  return `
    <div class="title-card pix" style="max-width:88%">
      <div class="fin-title">${T(UI.fin)}</div>
      <div class="dream-log"><h3>${T(UI.dreamLog)}</h3><ul>${items}</ul></div>
      <button class="start pix" style="margin-top:18px">${T(UI.restart)}</button>
      <div class="fin-foot">${T(UI.finFoot)}</div>
    </div>`;
}
function restart(){
  Object.keys(F).forEach(k=>delete F[k]);
  hideLayers(); choicesEl.innerHTML="";
  $("finScr").classList.add("hidden");
  hintEl.style.visibility="visible";
  goto("wake");
}

/* ───────── language ───────── */
function refreshLang(){
  $("langBtn").textContent=lang==="ko"?"EN":"KO";
  document.documentElement.lang=lang;
  $("ttMain").textContent=T(UI.ttMain);
  $("ttNote").innerHTML=T(UI.ttNote).replace(/\n/g,"<br>");
  hintEl.textContent=T(UI.hintTap);
  if(cur&&cur.ch) setChapter(cur.ch);
  if(statusEl.dataset.mood) setMoodUI(statusEl.dataset.mood);
  if(curLine){ if(typing) finishType();
    const el=LAYER[curLine.sp]||subEl;
    el.querySelector(".tx").innerHTML=fmt(T(curLine));
  }
  if(mode==="choices") showChoices();
  if(mode==="end"){ $("finScr").innerHTML=renderEndHTML(); $("finScr").querySelector(".start").onclick=restart; }
}
$("langBtn").onclick=e=>{ e.stopPropagation(); lang=lang==="ko"?"en":"ko"; refreshLang(); };
$("reBtn").onclick=e=>{ e.stopPropagation(); if(mode!=="title") restart(); };

/* ───────── input ───────── */
$("stage").addEventListener("click",e=>{
  if(e.target.closest("button")||e.target.closest(".overlay")) return;
  if(mode==="lines") advance();
});
document.addEventListener("keydown",e=>{
  if(e.key===" "||e.key==="Enter"){
    if(e.target.tagName==="BUTTON") return;
    e.preventDefault();
    if(mode==="lines") advance();
  }
  if(mode==="choices"&&/^[1-9]$/.test(e.key)){
    const i=+e.key-1, btns=choicesEl.querySelectorAll(".choice");
    if(btns[i]) btns[i].click();
  }
});

/* ───────── boot ───────── */
$("startBtn").onclick=()=>{
  $("titleScr").classList.add("hidden");
  goto("wake");
};

/* title-screen idle: clawd wanders */
setInterval(()=>{
  if(mode==="title"){ clawd.ex="idle"; clawd.tx=60+Math.random()*220; if(Math.random()<.3) S.hop(); }
},2600);

refreshLang();
setMoodUI("warm"); setChapter(1);
fit();
requestAnimationFrame(loop);
</script>

</html>
